site_name: MARS Documentation
site_description: GPU-native unstructured meshes and finite-element assembly (MARS v0.1)
site_author: MARS Team
repo_url: https://github.com/dganellari/mars
repo_name: mars

# Theme and plugins
theme:
  name: material
  palette:
    primary: blue
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

plugins:
  - search

# Internal design notes, talk material, LaTeX sources and pages that no longer match the code
# stay in the repository but are not published.
exclude_docs: |
  /design/
  /reference/
  /charts/
  /tables/
  /figures/
  *.tex
  /requirements.txt
  /Adjacency-Structures.md
  /AMR-Module.md
  /Characteristic-Sizes.md
  /Connectivity-Management.md
  /Coordinate-Caching.md
  /ElementDomain-Overview.md
  /GPU-Acceleration.md
  /Halo-Management.md
  /Interface-Search-And-Ghosting.md
  /Mesh-Reading-and-Partitioning.md
  /Multi-Rank-Support.md
  /Node-Halo-Topology.md
  /SFC-Mapping.md
  /Solution-Transfer.md

nav:
  - Home: index.md
  - Quickstart: Quickstart.md
  - Step by step:
      - "Step 1: the mesh": step-01-mesh.md
      - "Step 2: a first GPU loop": step-02-volume.md
      - "Step 3: Poisson's equation": step-03-poisson.md
      - "Step 4: control volumes": step-04-cvfem.md
      - "Step 5: your own operator": step-05-galerkin.md
      - "Step 6: the heat equation": step-06-heat.md
      - "Step 7: the lid-driven cavity": step-07-cavity.md
      - "Step 8: Poiseuille channel flow": poiseuille_tutorial.md
      - "Step 9: Taylor–Green vortex (periodic)": periodic_tgv_tutorial.md
      - "Step 10a: high-order matrix-free operator": Matrix-Free-Tutorial.md
      - "Step 10b: adaptive mesh refinement": AMR-Module.md
      - "Appendix: your own CMake project": step-appendix-cmake.md
  - Reference:
      - FEM assembly: FEM-Assembly.md
      - CVFEM assembly kernels: CVFEM-Kernels.md
  - Known limitations: https://github.com/dganellari/mars/blob/master/KNOWN_LIMITATIONS.md
  - Changelog: https://github.com/dganellari/mars/blob/master/CHANGELOG.md
